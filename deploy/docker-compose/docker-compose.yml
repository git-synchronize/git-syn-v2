services:
  git-serve:
    # Custom image: nginx serving git-http-backend through a small Go CGI
    # bridge (cgi-bridge/), not fcgiwrap. nginx has no native CGI support,
    # and fcgiwrap -- the usual bridge -- is what made git push hang and
    # 504 in an earlier version of this stack (see git history for
    # deploy/docker-compose/ for that story). See git-http/ for the
    # Dockerfile.
    build: ./git-http
    ports:
      - "80:80"
    volumes:
      - git-data:/var/lib/git
    restart: unless-stopped

volumes:
  git-data:
