include:
  template: Dependency-Scanning.gitlab-ci.yml

image: docker:latest

services:
  - docker:dind

test:
  image: debian:bookworm-slim
  services: []
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates git
    - curl https://mise.run | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - mise install
  script:
    - mise run check

build:
  script:
    - docker build -t git-syn/git-syn .
  only:
    - main

pages:
  image: python:alpine
  before_script:
    - apk add gcc linux-headers musl-dev
    - pip install -r requirements.txt
  script:
    - mkdocs build
  artifacts:
    paths:
      - public
  only:
    - main
